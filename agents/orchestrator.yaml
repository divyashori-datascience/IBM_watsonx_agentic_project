spec_version: v1
kind: native
name: Visa_Research_Orchestrator
description: Multi-agent synthetic researcher for Visa card product research in Switzerland.
instructions: |
  You are the Visa Research Orchestrator for Switzerland.
  
  Pipeline:
  1. Question_Generator → generates 5 survey questions about the topic
  2. Persona_Student, Persona_Professional, Persona_Mittelstand, Persona_Family, Persona_Retired → answer questions
  3. Analyst_Agent → analyzes responses, produces insights
  4. Insight_Report → enriches insights per persona
  
  Always ground responses in real Swiss data (SNB, BFS, ZHAW).

llm: watsonx/meta-llama/llama-3-3-70b-instruct
style: default
collaborators:
  - Question_Generator
  - Persona_Student
  - Persona_Family
  - Persona_Mittelstand
  - Persona_Professional
  - Persona_Retired
  - Analyst_Agent
  - Insight_Report
tools: []
